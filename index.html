<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carlo's Compass</title>
  <meta name="description" content="An interactive Bible map inspired by St. Carlo Acutis. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #002747;
      --parchment: #FAF3D7;
      --signature: #A80C31;
      --gold: #DBBB7C;
      --gold-text: #8A6420;
      --earth: #71421D;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Open Sans", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 34rem; }
    svg { width: 72px; height: 72px; margin-bottom: 24px; }
    h1 {
      font-family: "Merriweather", Georgia, serif;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p { color: var(--earth); font-size: 1.125rem; line-height: 1.6; }
    .soon {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--signature);
      color: #fff;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="none" stroke="#002747" stroke-width="3"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="#DBBB7C" stroke-width="2"/>
      <path d="M32 8 L38 32 L32 56 L26 32 Z" fill="#DBBB7C"/>
      <path d="M32 8 L38 32 L26 32 Z" fill="#A80C31"/>
      <circle cx="32" cy="32" r="3" fill="#002747"/>
    </svg>
    <h1>Carlo's Compass</h1>
    <p>An interactive map of the places in Scripture, inspired by St. Carlo Acutis.</p>
    <span class="soon">Coming soon</span>
  </main>
</body>
</html>
