# Pack settings for the Catholic site. The engine reads these; nothing here is hard-coded in it.
name: Carlo's Compass
# Certainty labels and the one-sentence explanation shown on hover (desktop) or tap (phone).
certainty:
  confirmed:
    label: Confirmed location
    explain: Archaeology or an unbroken record ties this place to this exact spot.
  probable:
    label: Probable location
    explain: Most scholars place it here, but the exact spot is not proven.
  uncertain:
    label: Uncertain location
    explain: Scholars disagree about where this place was; the pin marks one proposal.
# Demo contact for "Suggest an edit" (Joseph, 2026-11-13; see docs/vision.md).
suggest_edit:
  label: Suggest an edit
  phone: 605-261-7740
# The only checkbox groups in Explore (Joseph, 2026-11-13: just the main collections; country and
# region stay in the data for search and later, but are not offered as checkboxes).
explore_filters:
  - key: collection
    label: Collections
  - key: history
    label: Historical events   # context for the timeline; emperors etc. may join later
# Pin color for each collection (an Explore box), as a brand color role. The same color shows as a
# dot beside the box in Explore and on its tag in the search bar (Joseph, 2026-11-13).
pin_colors:
  Eucharistic miracles: earth
  Life of Jesus: gold        # light gold with a darker ring (brown and gold-text looked alike)
  World history: ink
links:
  donate: "#donate"
# Where the map opens on first load: zoomed out over the Mediterranean, so Europe (the miracles)
# and the Holy Land (Jesus) are both in view and it is clear what you are looking at
# (Joseph, 2026-11-13; was a close-up of the Holy Land).
start_view: { lng: 22, lat: 40, zoom: 2.7 }
# Jerusalem context is a teaching aid, not a reconstruction of city walls.
city_view:
  name: Jerusalem
  place_id: jerusalem
  lng: 35.234156
  lat: 31.776679
  zoom: 10
  periods:
    - from: -1000
      to: -587
      title: First Temple Jerusalem
      subtitle: c. 1000–587 BC
      summary: Jerusalem became the seat of the kingdom of Judah. The extent of the city in its earliest centuries remains debated.
      source: https://www.jerusalemlocal.com/jerusalem-through-time
    - from: -586
      to: -333
      title: Exile and return
      subtitle: 586–333 BC
      summary: Babylon destroyed Jerusalem and its Temple. Under Persian rule, the Temple and city walls were rebuilt.
      source: https://www.britannica.com/place/Jerusalem/History
    - from: -332
      to: -64
      title: Greek and Hasmonean Jerusalem
      subtitle: 332–64 BC
      summary: Jerusalem came under Hellenistic rulers, then became the capital of the Hasmonean kingdom.
      source: https://www.britannica.com/place/Jerusalem/History
    - from: -63
      to: 69
      title: Jerusalem in the time of Jesus
      subtitle: 63 BC–AD 69
      summary: Under Roman rule, Herod expanded the Temple complex. Jesus visited Jerusalem during this era; the city and Temple were destroyed in AD 70.
      source: https://www.jerusalemlocal.com/jerusalem-through-time
    - from: 70
      to: 323
      title: Roman Jerusalem
      subtitle: AD 70–323
      summary: After the destruction of the city and Temple, the Romans later established the colony of Aelia Capitolina.
      source: https://www.britannica.com/place/Jerusalem/History
    - from: 324
      to: 637
      title: Byzantine Jerusalem
      subtitle: AD 324–637
      summary: Jerusalem grew as a Christian pilgrimage center, and the Church of the Holy Sepulchre was dedicated in this period.
      source: https://www.jerusalemlocal.com/jerusalem-through-time
    - from: 638
      to: 1098
      title: Early Islamic Jerusalem
      subtitle: AD 638–1098
      summary: Jerusalem came under Muslim rule. The Dome of the Rock was built on the Temple Mount in the late seventh century.
      source: https://www.britannica.com/place/Jerusalem/History
    - from: 1099
      to: 1186
      title: Crusader Jerusalem
      subtitle: AD 1099–1186
      summary: Jerusalem became the capital of a Crusader kingdom following the conquest of the city in 1099.
      source: https://www.britannica.com/place/Jerusalem/History
    - from: 1187
      to: 1515
      title: Ayyubid and Mamluk Jerusalem
      subtitle: AD 1187–1515
      summary: Saladin took Jerusalem in 1187; Ayyubid and later Mamluk rulers governed the city in the centuries that followed.
      source: https://www.britannica.com/place/Jerusalem/History
# Realm borders on the map (vision.md "Basemap"). The pack pins the border year: 100 AD for the
# Gospel era, because the 1 BC data is wrong around Galilee and Samaria. Files are made by
# app/scripts/build_borders.py from historical-basemaps (GPL-3.0; license still to confirm).
borders:
  year: 100
  # Hide them once the timeline passes this year (a 1264 miracle is not in the Roman Empire).
  until: 300
  periods:
    - { year: 100, from: -50, to: 300, file: '100' }
    - { year: 1200, from: 1100, to: 1300, file: '1200' }
  note: Borders approximate · c. 100 AD
