# Pack settings for the Catholic site. The engine reads these; nothing here is hard-coded in it.
name: Carlo's Compass
# Certainty labels and the one-sentence explanation shown on hover (desktop) or tap (phone).
certainty:
  confirmed:
    label: Confirmed location
    explain: Archaeology or an unbroken record ties this place to this exact spot.
  probable:
    label: Probable location
    explain: Most scholars place it here, but the exact spot is not proven.
  uncertain:
    label: Uncertain location
    explain: Scholars disagree about where this place was; the pin marks one proposal.
# Demo contact for "Suggest an edit" (Joseph, 2026-11-13; see docs/vision.md).
suggest_edit:
  label: Suggest an edit
  phone: 605-261-7740
# The only checkbox groups in Explore (Joseph, 2026-11-13: just the main collections; country and
# region stay in the data for search and later, but are not offered as checkboxes).
explore_filters:
  - key: collection
    label: Collections
  - key: history
    label: Historical events   # context for the timeline; emperors etc. may join later
# Pin color for each collection (an Explore box), as a brand color role. The same color shows as a
# dot beside the box in Explore and on its tag in the search bar (Joseph, 2026-11-13).
pin_colors:
  Eucharistic miracles: earth
  Life of Jesus: gold        # light gold with a darker ring (brown and gold-text looked alike)
  World history: ink
  Exodus: muted              # slate; the one brand role not yet used for pins (2026-11-14 overnight draft)
links:
  involved: "#involved"   # Get involved page (involved.md); donations will live there later
# Where the map opens on first load: zoomed out over the Mediterranean, so Europe (the miracles)
# and the Holy Land (Jesus) are both in view and it is clear what you are looking at
# (Joseph, 2026-11-13; was a close-up of the Holy Land).
start_view: { lng: 22, lat: 40, zoom: 2.7 }
# Realm borders on the map (vision.md "Basemap"). The map shows the border year whose range holds
# the timeline year (from <= year < until) and hides borders outside every range. `start` is the one
# shown before there is a timeline year (on first load). Ranges meet halfway
# between years, except 100 AD, which the pack pins for the whole Gospel era because the 1 BC data is
# wrong around Galilee and Samaria. Picked by Joseph 2026-11-14 (docs/mockups/2026-11-14-border-years.png).
# Files are made by app/scripts/build_borders.py from historical-basemaps (GPL-3.0; license still to confirm).
borders:
  - { year: -1500, from: -2500, until: -700, note: Borders approximate · c. 1500 BC }   # Exodus
  - { year: 100,   from: -700,  until: 250,  note: Borders approximate · c. 100 AD, start: true }  # Life of Jesus; shown before the timeline moves
  - { year: 400,   from: 250,   until: 550,  note: Borders approximate · c. 400 AD }
  - { year: 700,   from: 550,   until: 850,  note: Borders approximate · c. 700 AD }
  - { year: 1000,  from: 850,   until: 1100, note: Borders approximate · c. 1000 AD }
  - { year: 1200,  from: 1100,  until: 1250, note: Borders approximate · c. 1200 AD }
  - { year: 1300,  from: 1250,  until: 1350, note: Borders approximate · c. 1300 AD }
  - { year: 1400,  from: 1350,  until: 1500, note: Borders approximate · c. 1400 AD }
  - { year: 1600,  from: 1500,  until: 1750, note: Borders approximate · c. 1600 AD }
  - { year: 1900,  from: 1750,  until: 1955, note: Borders approximate · c. 1900 AD }
  - { year: 2010,  from: 1955,  until: 2100, note: Borders c. 2010 }
