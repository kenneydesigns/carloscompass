events:
  - title: The Annunciation
    date: { from: -6, approx: true }
    summary: >-
      The angel Gabriel was sent to Mary, a virgin of Nazareth in Galilee, to announce that she
      would bear a son and name him Jesus. Mary answered, "Behold, I am the handmaid of the Lord."
      Jesus later grew up here and was known as Jesus of Nazareth.
