events:
  - title: Luther's Ninety-five Theses
    date: { from: 1517 }
    summary: >-
      On 31 October 1517 Martin Luther, a monk and professor at Wittenberg, sent his Ninety-five
      Theses against the sale of indulgences to the Archbishop of Mainz. Tradition holds he also
      posted them on the door of the Castle Church. The dispute began the Protestant Reformation.
