<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Carlo illustration (dark, tone-on-tone)</title>
  <!-- v2, 2026-11-13. Original drawing inspired by the Covent Garden icon of St. Carlo; not traced.
       Made with design/illustration/tuner.html, preset "Tone-on-tone". Light comes from the Eucharist,
       but the ciborium is only warmer, not brighter, than the figure around it. -->
  <defs>
    <radialGradient id="g-bg" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="276"><stop offset="0" stop-color="#27221a"/><stop offset="0.5" stop-color="#0D0B08"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <radialGradient id="g-lit" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="230"><stop offset="0" stop-color="#3f3629"/><stop offset="0.45" stop-color="#1f1b15"/><stop offset="1" stop-color="#0C0B09"/></radialGradient>
    <radialGradient id="g-screen" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="138"><stop offset="0" stop-color="#66573d"/><stop offset="0.55" stop-color="#1f1b15"/><stop offset="1" stop-color="#161310"/></radialGradient>
    <radialGradient id="g-deck" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="147.2"><stop offset="0" stop-color="#1f1b15"/><stop offset="1" stop-color="#100E0B"/></radialGradient>
    <radialGradient id="g-halo" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="230"><stop offset="0" stop-color="#7b6948"/><stop offset="1" stop-color="#16120d"/></radialGradient>
    <radialGradient id="g-host" gradientUnits="userSpaceOnUse" cx="256" cy="320" r="70"><stop offset="0" stop-color="#705a36"/><stop offset="1" stop-color="#4d3d22"/></radialGradient>
    <radialGradient id="g-pool"><stop offset="0" stop-color="#f5eed7" stop-opacity="0.09"/><stop offset="1" stop-color="#DBBB7C" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g-bg)"/>
  <g transform="translate(256 300) scale(1.14) translate(-256 -300)">
    <!-- halo -->
    <circle cx="256" cy="178" r="104" fill="url(#g-halo)"/>
    <!-- shoulders -->
    <path d="M64 520 L70 372 Q78 300 160 282 L214 266 Q256 292 298 266 L352 282 Q434 300 442 372 L448 520 Z" fill="url(#g-lit)" stroke="#050505" stroke-width="6" stroke-linejoin="round"/>
    <!-- head + curls (drawn twice: dark outline gap over the halo, then the fill) -->
    <g fill="url(#g-lit)" stroke="#050505" stroke-width="6" stroke-linejoin="round"><ellipse cx="256" cy="192" rx="52" ry="60"/><ellipse cx="256" cy="166" rx="62" ry="54"/><circle cx="194.9" cy="158.3" r="16"/><circle cx="202.3" cy="140.0" r="16"/><circle cx="216.1" cy="125.1" r="16"/><circle cx="234.8" cy="115.4" r="16"/><circle cx="256.0" cy="112.0" r="16"/><circle cx="277.2" cy="115.4" r="16"/><circle cx="295.9" cy="125.1" r="16"/><circle cx="309.7" cy="140.0" r="16"/><circle cx="317.1" cy="158.3" r="16"/><rect x="234" y="232" width="44" height="42"/></g>
    <g fill="url(#g-lit)"><ellipse cx="256" cy="192" rx="52" ry="60"/><ellipse cx="256" cy="166" rx="62" ry="54"/><circle cx="194.9" cy="158.3" r="16"/><circle cx="202.3" cy="140.0" r="16"/><circle cx="216.1" cy="125.1" r="16"/><circle cx="234.8" cy="115.4" r="16"/><circle cx="256.0" cy="112.0" r="16"/><circle cx="277.2" cy="115.4" r="16"/><circle cx="295.9" cy="125.1" r="16"/><circle cx="309.7" cy="140.0" r="16"/><circle cx="317.1" cy="158.3" r="16"/><rect x="234" y="232" width="44" height="42"/></g>
    <!-- laptop screen + faint light pool -->
    <rect x="150" y="300" width="212" height="142" rx="6" fill="url(#g-screen)" stroke="#050505" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="256" cy="408" rx="78" ry="26" fill="url(#g-pool)"/>
    <!-- keyboard deck -->
    <path d="M150 442 H362 L400 490 H112 Z" fill="url(#g-deck)" stroke="#050505" stroke-width="6" stroke-linejoin="round"/>
    <!-- ciborium, no cross -->
    <g fill="url(#g-host)">
      <circle cx="256" cy="276" r="6"/>
      <path d="M226 300 Q228 283 256 281 Q284 283 286 300 Z"/>
      <rect x="220" y="298" width="72" height="9" rx="4.5"/>
      <path d="M222 309 H290 Q292 343 256 349 Q220 343 222 309 Z"/>
      <rect x="250" y="348" width="12" height="38"/>
      <ellipse cx="256" cy="366" rx="10" ry="6"/>
      <ellipse cx="256" cy="390" rx="23" ry="7"/>
    </g>
  </g>
</svg>
